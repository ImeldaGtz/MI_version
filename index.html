<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coso gráfico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid row" >
        <h2 class="col-12 text-center" >Método gráfico</h2>
        
        <div class="m-3 row align-items-center">
            <div class="col-6">
                <div class="row justify-content-center">
                    <h4 class="col-12 text-center" >Variables de decisión</h4>
                    <p class="col-1">x:</p> <input class="col-7" type="text" id="variable_X">
                </div>
                <div class="row justify-content-center">
                    <p class="col-1">y:</p> <input class="col-7" type="text" id="variable_Y">
                </div>
            </div>

            <div class="col-6">
                <div class="row justify-content-center">
                    <h4 class="col-12 text-center" >Restricciones</h4>
                    
                    <textarea class="col-8" placeholder="uno por línea.Sin espacios" id="restricciones">6x+4y<=24
x+2y<=6
-x+y<=1
y<=2
x>=0
y>=0</textarea>

                </div>
            </div>
        </div>
        <div class="m-3 row column-gap-3 justify-content-center">
            <p class="col-1">z:</p> <input class="col-3" type="text" id="objetivo">
            <select class="col-3" name="tipo" id="sct_tipo">
                <option value="min">Minimizar</option>
                <option value="max">Maximizar</option>
            </select>
            <button class="col-3 btn btn-primary" id="ayuda">Graficar</button>
        </div>
    </div>
    
    <h3 id="respuesta"></h3>

    <div class="container-fluid d-flex justify-content-center">
        <canvas id="canvas" height="500" width="500"></canvas>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
